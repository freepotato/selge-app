name: Selge
options:
  bundleIdPrefix: com.freepotato
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "$(TARGET_NAME)"
    GENERATE_INFOPLIST_FILE: NO
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  Selge:
    type: application
    platform: iOS
    sources:
      - Selge
      - path: docs/CHANGELOG.md
        buildPhase: resources
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freepotato.selge
        CODE_SIGN_ENTITLEMENTS: Selge/Entitlements/Selge.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # CloudKit 仅在 Release（付费签名/Archive/TestFlight）构建中启用，
        # Debug 真机运行（免费个人团队签名）走纯本地存储
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: SELGE_CLOUDKIT
    info:
      path: Selge/Info.plist
      properties:
        CFBundleDisplayName: Selge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # CloudKit 推送同步所需的后台模式（仅 CloudKit 启用时实际生效）
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
