name: Selge
options:
  bundleIdPrefix: com.freepotato
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "$(TARGET_NAME)"
    GENERATE_INFOPLIST_FILE: NO
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  Selge:
    type: application
    platform: iOS
    sources:
      - Selge
      - path: docs/CHANGELOG.md
        buildPhase: resources
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freepotato.selge
        CODE_SIGN_ENTITLEMENTS: Selge/Entitlements/Selge.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 本地真机调试使用的开发团队（个人团队）；加入付费开发者计划后替换此值即可
        DEVELOPMENT_TEAM: JABSPG7D6F
      configs:
        # Debug：空声明文件，个人免费团队签名即可真机安装（纯本地存储）
        Debug:
          CODE_SIGN_ENTITLEMENTS: Selge/Entitlements/SelgeDebug.entitlements
        # Release：完整 iCloud 声明 + SELGE_CLOUDKIT 编译条件（付费签名/Archive/TestFlight）
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: SELGE_CLOUDKIT
    info:
      path: Selge/Info.plist
      properties:
        CFBundleDisplayName: Selge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 内置宋体风格 Logo 字体（思源宋体子集，SIL OFL 授权，见 Resources/OFL.txt）
        UIAppFonts:
          - SelgeSerif-Bold.ttf
          - SelgeSerif-Regular.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # CloudKit 推送同步所需的后台模式（仅 CloudKit 启用时实际生效）
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
